[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rollbook"
version = "0.1.0.dev0"
description = "A tested, installable pipeline for turning scans of 19th-century case indexes into structured, queryable databases of authorities."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Benedict Stanley" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pdf2image>=1.16", "kraken>=7.1", "rich"]

[project.urls]
Homepage = "https://github.com/BCStanley/rollbook"
"Predecessor" = "https://github.com/BCStanley/case_locator"

[project.scripts]
rollbook = "rollbook.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["rollbook"]
strict = true

[[tool.mypy.overrides]]
module = "pdf2image"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
